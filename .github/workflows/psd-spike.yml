name: PSD Spike

on:
  pull_request:
    paths:
      - "crates/yu-psd-spike/**"
      - "fixtures/psd/**"
      - ".github/workflows/psd-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psd-tools-reference:
    name: psd-tools reference / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned reference runtime
        run: python -m pip install --disable-pip-version-check "psd-tools==1.20.0"
      - name: Verify pinned reference runtime
        run: python -c "import sys; from psd_tools.version import __version__; assert sys.version_info[:2] == (3, 12); assert __version__ == '1.20.0'; print(f'Python {sys.version_info.major}.{sys.version_info.minor} / psd-tools {__version__}')"
      - name: Run psd-tools corpus conformance
        env:
          YU_PSD_TOOLS_PYTHON: python
        run: cargo test -p yu-psd-spike psd_tools_reference_matches_committed_corpus -- --ignored --nocapture


  rawpsd-candidate:
    name: rawpsd candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run rawpsd candidate corpus report
        run: cargo test -p yu-psd-spike rawpsd_candidate_runs_committed_corpus_without_harness_errors -- --nocapture


  ag-psd-candidate:
    name: ag-psd candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned TypeScript candidate runtime
        run: npm install --prefix crates/yu-psd-spike/adapters/typescript --ignore-scripts --no-audit --no-fund
      - name: Verify pinned TypeScript candidate runtime
        run: node -e "const p=require('./crates/yu-psd-spike/adapters/typescript/node_modules/ag-psd/package.json'); if (process.versions.node.split('.')[0] !== '22') process.exit(1); if (p.version !== '31.0.2') process.exit(1); console.log('Node ' + process.versions.node + ' / ag-psd ' + p.version)"
      - name: Run ag-psd candidate corpus report
        env:
          YU_TYPESCRIPT_PSD_NODE: node
        run: cargo test -p yu-psd-spike ag_psd_candidate_runs_committed_corpus_without_harness_errors -- --ignored --nocapture
