[workspace]
members = [
    "crates/yu-capability-image",
    "crates/yu-cli",
    "crates/yu-core",
    "crates/yu-engine-api",
    "crates/yu-engine-image-rs",
    "crates/yu-engine-manager",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
